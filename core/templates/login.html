{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Croissant Rouge Solidarité</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --rouge-primary: #D64545;
            --rouge-light: #F2E8E8;
            --rouge-accent: #B63838;
            --neutral-dark: #2C2C2C;
            --neutral-medium: #6B6B6B;
            --neutral-light: #F8F8F8;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #FAFAFA 0%, var(--rouge-light) 100%);
            min-height: 100vh;
            color: var(--neutral-dark);
        }
        
        .serif {
            font-family: 'Crimson Pro', serif;
        }
        
        .login-container {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
            from {
                opacity: 0;
                transform: translateY(20px);
            }
        }
        
        .crescent-decoration {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 30px solid var(--rouge-primary);
            border-right-color: transparent;
            opacity: 0.1;
            transform: rotate(-45deg);
        }
        
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .input-group input {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid #E5E5E5;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--rouge-primary);
            box-shadow: 0 0 0 4px rgba(214, 69, 69, 0.1);
        }
        
        .input-group label {
            position: absolute;
            left: 1.25rem;
            top: 1rem;
            color: var(--neutral-medium);
            pointer-events: none;
            transition: all 0.3s ease;
            background: white;
            padding: 0 0.5rem;
        }
        
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: -0.75rem;
            font-size: 0.875rem;
            color: var(--rouge-primary);
        }
        
        .btn-primary {
            background: var(--rouge-primary);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 1.05rem;
        }
        
        .btn-primary:hover {
            background: var(--rouge-accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(214, 69, 69, 0.3);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            padding: 3rem;
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--rouge-primary), var(--rouge-accent));
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center px-4 py-12 relative overflow-hidden">
        <!-- Background Decorations -->
        <div class="crescent-decoration" style="top: -100px; left: -100px;"></div>
        <div class="crescent-decoration" style="bottom: -100px; right: -100px; transform: rotate(135deg);"></div>
        
        <div class="login-container w-full max-w-md">
            <!-- Logo & Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center bg-gradient-to-br from-red-500 to-red-600 rounded-2xl mb-4 shadow-lg">
                    <img src="{% static 'logo.jpg' %}" alt="Croissant Rouge" class="w-32 h-32 object-cover rounded-2xl">
                </div>
                <h1 class="text-4xl font-bold mb-2 serif" style="color: var(--rouge-primary);">Croissant Rouge Algérien</h1>
                <p class="text-neutral-medium text-lg">Plateforme de Solidarité</p>
            </div>
            
            <!-- Login Form -->
            <div class="card">
                <h2 class="text-2xl font-bold mb-6 serif">Connexion</h2>
                
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}

                    <div class="input-group">
                        <input type="email" name="email" id="email" placeholder=" " required>
                        <label for="email">Adresse email</label>
                    </div>

                    <div class="input-group">
                        <input type="password" name="password" id="password" placeholder=" " required>
                        <label for="password">Mot de passe</label>
                    </div>

                    <div class="flex items-center justify-between mb-6">
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox"
                                class="w-4 h-4 text-red-500 border-gray-300 rounded">
                            <span class="ml-2 text-sm text-neutral-medium">Se souvenir de moi</span>
                        </label>

                        <a href="#" class="text-sm font-medium text-red-500">
                            Mot de passe oublié ?
                        </a>
                    </div>

                    <button type="submit" class="btn-primary">
                        Se connecter
                    </button>
                </form>

                
                <div class="mt-6 text-center">
                    <p class="text-neutral-medium">
                        Pas encore de compte? 
                        <a href="{% url 'signup' %}" class="font-semibold" style="color: var(--rouge-primary);">S'inscrire</a>
                    </p>
                </div>
            </div>
            
            <!-- Footer -->
            <div class="text-center mt-8 text-sm text-neutral-medium">
                <p>Ensemble pour une aide équitable et coordonnée</p>
            </div>
        </div>
    </div>
</body>
</html>
